<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Redirect to base URL with path in hash so GitHub Pages serves index.html once.
      // The SPA will then replace the URL with the clean path (no hash).
      var l = window.location;
      var base = '/shota-portfolio';
      var pathWithoutBase = l.pathname.replace(base, '') || '/';
      var cleanPath = pathWithoutBase.replace(/\/index\.html/g, '') || '/';
      var redirectUrl = l.origin + base + (cleanPath === '/' ? '' : '#' + cleanPath) + (l.search || '');
      window.location.replace(redirectUrl);
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/shota-portfolio/">
    </noscript>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
